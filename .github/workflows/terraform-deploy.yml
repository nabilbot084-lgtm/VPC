name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select target environment / AWS account"
        required: true
        type: environment

      action:
        description: "Select Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

      confirm_destroy:
        description: "For destroy only: type the environment name to confirm"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Guard environment and branch mapping
        run: |
          ENV_FILE=$(echo "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

          case "$ENV_FILE" in
            dev)  EXPECTED_BRANCH="dev-main" ;;
            test) EXPECTED_BRANCH="test-main" ;;
            *)
              echo "::error::Unsupported environment '$ENVIRONMENT'"
              exit 1
              ;;
          esac

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ]; then
            echo "::error::Environment '$ENVIRONMENT' can only be deployed from branch '$EXPECTED_BRANCH' (running on '$GITHUB_REF_NAME')"
            exit 1
          fi

      - name: Guard destroy
        if: ${{ env.ACTION == 'destroy' }}
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::Destroy blocked. Set 'confirm_destroy' to '$ENVIRONMENT' to proceed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment config files
        run: |
          for f in "environments/${ENV_FILE}.tfvars" "environments/${ENV_FILE}.backend.hcl"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="environments/${ENV_FILE}.backend.hcl"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ env.ACTION == 'apply' }}
        run: terraform plan -var-file="environments/${ENV_FILE}.tfvars" -out=tfplan

      - name: Terraform Apply
        if: ${{ env.ACTION == 'apply' }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy Plan
        if: ${{ env.ACTION == 'destroy' }}
        run: terraform plan -destroy -var-file="environments/${ENV_FILE}.tfvars" -out=tfdestroy

      - name: Terraform Destroy
        if: ${{ env.ACTION == 'destroy' }}
        run: terraform apply -auto-approve tfdestroy